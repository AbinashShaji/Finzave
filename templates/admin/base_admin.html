<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinZave Admin{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Structural layout to enforce strict sidebar and content boundaries on desktop */
        @media (min-width: 768px) {
            .admin-desktop-grid {
                display: grid;
                grid-template-columns: 16rem minmax(0, 1fr);
                min-height: 100vh;
            }
        }
    </style>
</head>
<body class="bg-fz-gray-50 text-fz-black font-sans selection:bg-fz-red selection:text-white relative admin-desktop-grid">

    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between bg-fz-black text-white px-6 py-4 sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-white text-fz-black flex items-center justify-center font-bold text-xl tracking-tighter">FZ</div>
            <span class="font-bold text-xl tracking-tight">Admin</span>
        </div>
        <button id="mobile-menu-btn" class="p-2 relative z-50">
            <i data-lucide="menu"></i>
        </button>
    </div>

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-fz-black text-white transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-screen md:h-auto sticky top-0 overflow-y-auto">
        <div class="p-6">
            <a href="{{ url_for('admin.dashboard') }}" class="flex items-center gap-2 group mb-10">
                <div class="w-8 h-8 rounded-lg bg-white text-fz-black flex items-center justify-center font-bold text-xl tracking-tighter group-hover:bg-fz-red group-hover:text-white transition-colors duration-300">FZ</div>
                <span class="font-bold text-xl tracking-tight">FinZave Admin</span>
            </a>
            
            <nav class="flex flex-col gap-2">
                <a href="{{ url_for('admin.dashboard') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-800 {% if request.endpoint == 'admin.dashboard' %}bg-fz-gray-800 text-white{% else %}text-fz-gray-400{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="{{ url_for('admin.users') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-800 {% if request.endpoint == 'admin.users' %}bg-fz-gray-800 text-white{% else %}text-fz-gray-400{% endif %}">
                    <i data-lucide="users" class="w-5 h-5"></i> Users
                </a>
                <a href="{{ url_for('admin.reviews') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-800 {% if request.endpoint == 'admin.reviews' %}bg-fz-gray-800 text-white{% else %}text-fz-gray-400{% endif %}">
                    <i data-lucide="star" class="w-5 h-5"></i> Reviews
                </a>
                <a href="{{ url_for('admin.feedback') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-800 {% if request.endpoint == 'admin.feedback' %}bg-fz-gray-800 text-white{% else %}text-fz-gray-400{% endif %}">
                    <i data-lucide="message-square" class="w-5 h-5"></i> Feedback
                </a>
                <a href="{{ url_for('admin.profile') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-800 {% if request.endpoint == 'admin.profile' %}bg-fz-gray-800 text-white{% else %}text-fz-gray-400{% endif %}">
                    <i data-lucide="user" class="w-5 h-5"></i> Profile
                </a>
            </nav>
        </div>
        
        <div class="mt-auto p-6 border-t border-fz-gray-800">
            <button onclick="logout()" class="flex items-center gap-3 px-4 py-3 w-full rounded-lg text-sm font-medium text-fz-gray-400 hover:text-white hover:bg-fz-red transition-colors text-left">
                <i data-lucide="log-out" class="w-5 h-5"></i> Log out
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex flex-col min-h-screen max-w-full min-w-0">
        <header class="bg-white border-b border-fz-gray-200 h-[72px] hidden md:flex flex-shrink-0 items-center justify-between px-8 sticky top-0 z-20">
            <h1 class="text-xl font-bold tracking-tight">{% block header_title %}Dashboard{% endblock %}</h1>
            <div class="flex items-center gap-4">
                <a href="{{ url_for('admin.profile') }}" title="Admin Profile" class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-fz-black text-white text-sm font-semibold hover:bg-fz-red hover:shadow-md transition-all duration-300 ring-2 ring-transparent hover:ring-fz-red/30 focus:outline-none" id="header-avatar">
                    A
                </a>
            </div>
        </header>

        <div class="p-6 md:p-8 flex-1 w-full max-w-full overflow-x-hidden">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Global Confirm Modal -->
    <div id="global-confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl transform scale-95 opacity-0 transition-all duration-200" id="global-confirm-modal-content">
            <h3 class="text-lg font-bold text-fz-black mb-2" id="global-confirm-title">Confirm Action</h3>
            <p class="text-sm text-fz-gray-600 mb-6" id="global-confirm-msg">Are you sure you want to proceed?</p>
            <div class="flex justify-end gap-3">
                <button id="global-confirm-cancel" class="px-4 py-2 text-sm font-semibold text-fz-gray-600 hover:text-fz-black hover:bg-fz-gray-100 rounded-lg transition-colors">Cancel</button>
                <button id="global-confirm-ok" class="px-4 py-2 text-sm font-semibold text-white bg-fz-red hover:bg-red-600 rounded-lg shadow-sm transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    {% block modals %}{% endblock %}

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            
            const btn = document.getElementById('mobile-menu-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            function toggleMenu() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            if (btn && sidebar && overlay) {
                btn.addEventListener('click', toggleMenu);
                overlay.addEventListener('click', toggleMenu);
            }

            // Fetch admin user dynamically for the header avatar if present
            const avatarEl = document.getElementById('header-avatar');
            if (avatarEl) {
                fetch('/api/auth/me')
                    .then(res => res.ok ? res.json() : null)
                    .then(user => {
                        if (user && user.username) {
                            avatarEl.textContent = user.username.charAt(0).toUpperCase();
                        }
                    })
                    .catch(err => console.error('Error fetching admin avatar:', err));
            }
        });

        let currentConfirmCallback = null;
        
        function showConfirmModal(title, message, onConfirm) {
            document.getElementById('global-confirm-title').textContent = title;
            document.getElementById('global-confirm-msg').textContent = message;
            currentConfirmCallback = onConfirm;
            
            const modal = document.getElementById('global-confirm-modal');
            const content = document.getElementById('global-confirm-modal-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeConfirmModal() {
            const modal = document.getElementById('global-confirm-modal');
            const content = document.getElementById('global-confirm-modal-content');
            
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                currentConfirmCallback = null;
            }, 200);
        }

        document.getElementById('global-confirm-cancel')?.addEventListener('click', closeConfirmModal);
        document.getElementById('global-confirm-ok')?.addEventListener('click', () => {
            if (currentConfirmCallback) currentConfirmCallback();
            closeConfirmModal();
        });

        async function logout() {
            try {
                const res = await fetch('/api/auth/logout', { method: 'POST' });
                if (res.ok) {
                    window.location.href = '/login';
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
