{% extends "admin/base_admin.html" %}

{% block title %}Manage Reviews - FinZave Admin{% endblock %}
{% block header_title %}Review Management{% endblock %}

{% block content %}
<div class="bg-white rounded-xl border border-fz-gray-200 overflow-hidden shadow-sm">
    <div class="p-6 border-b border-fz-gray-200 flex justify-between items-center">
        <h2 class="text-lg font-bold">All Reviews</h2>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-fz-gray-50 border-b border-fz-gray-200 text-fz-gray-500 uppercase font-semibold text-xs tracking-wider">
                <tr>
                    <th scope="col" class="px-6 py-4">ID</th>
                    <th scope="col" class="px-6 py-4">User</th>
                    <th scope="col" class="px-6 py-4">Rating</th>
                    <th scope="col" class="px-6 py-4">Content</th>
                    <th scope="col" class="px-6 py-4">Status</th>
                    <th scope="col" class="px-6 py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="reviews-tbody" class="divide-y divide-fz-gray-200">
                <tr>
                    <td colspan="6" class="px-6 py-8 text-center text-fz-gray-500">Loading reviews...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", fetchReviews);

    async function fetchReviews() {
        try {
            const res = await fetch('/api/admin/reviews');
            if (res.ok) {
                const reviews = await res.json();
                const tbody = document.getElementById('reviews-tbody');
                
                if (reviews.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-fz-gray-500">No reviews found.</td></tr>';
                    return;
                }

                tbody.innerHTML = reviews.map(r => `
                    <tr class="hover:bg-fz-gray-50 transition-colors">
                        <td class="px-6 py-4 font-mono text-xs text-fz-gray-500">#${r.id}</td>
                        <td class="px-6 py-4 font-medium">${r.username}</td>
                        <td class="px-6 py-4">
                            <div class="flex text-yellow-400">
                                ${Array(5).fill(0).map((_, i) => `<svg class="w-4 h-4 ${i < r.rating ? 'fill-current' : 'text-gray-300'}" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`).join('')}
                            </div>
                        </td>
                        <td class="px-6 py-4 max-w-xs truncate text-fz-gray-600" title="${r.content || ''}">${r.content || '-'}</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                                r.status === 'approved' ? 'bg-green-100 text-green-800' : 
                                (r.status === 'rejected' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800')
                            }">
                                ${r.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <select onchange="updateStatus(${r.id}, this.value)" class="text-xs border border-fz-gray-200 rounded px-2 py-1 mr-2 focus:ring-1 focus:ring-fz-black focus:border-fz-black outline-none">
                                <option value="pending" ${r.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="approved" ${r.status === 'approved' ? 'selected' : ''}>Approve</option>
                                <option value="rejected" ${r.status === 'rejected' ? 'selected' : ''}>Reject</option>
                            </select>
                            <button onclick="deleteReview(${r.id})" class="text-fz-red hover:text-red-700 font-medium text-xs bg-red-50 hover:bg-red-100 px-3 py-1 rounded transition-colors">Delete</button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error('Error fetching reviews:', error);
            document.getElementById('reviews-tbody').innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-500">Error loading reviews.</td></tr>';
        }
    }

    async function updateStatus(reviewId, newStatus) {
        try {
            const res = await fetch(`/api/admin/reviews/${reviewId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            if (res.ok) {
                fetchReviews();
            } else {
                const err = await res.json();
                alert(err.message || 'Failed to update status');
                fetchReviews();
            }
        } catch (e) {
            console.error(e);
            alert('Error updating status');
        }
    }

    async function deleteReview(reviewId) {
        if (!confirm('Are you sure you want to delete this review?')) return;
        
        try {
            const res = await fetch(`/api/admin/reviews/${reviewId}`, { method: 'DELETE' });
            if (res.ok) {
                fetchReviews();
            } else {
                const err = await res.json();
                alert(err.message || 'Failed to delete review');
            }
        } catch (e) {
            console.error(e);
            alert('Error deleting review');
        }
    }
</script>
{% endblock %}
