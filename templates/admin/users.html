{% extends "admin/base_admin.html" %}

{% block title %}Manage Users - FinZave Admin{% endblock %}
{% block header_title %}User Management{% endblock %}

{% block content %}
<div class="bg-white rounded-xl border border-fz-gray-200 overflow-hidden shadow-sm">
    <div class="p-6 border-b border-fz-gray-200 flex justify-between items-center">
        <h2 class="text-lg font-bold">All Users</h2>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-fz-gray-50 border-b border-fz-gray-200 text-fz-gray-500 uppercase font-semibold text-xs tracking-wider">
                <tr>
                    <th scope="col" class="px-6 py-4">ID</th>
                    <th scope="col" class="px-6 py-4">Username</th>
                    <th scope="col" class="px-6 py-4">Email</th>
                    <th scope="col" class="px-6 py-4">Role</th>
                    <th scope="col" class="px-6 py-4">Joined</th>
                    <th scope="col" class="px-6 py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="users-tbody" class="divide-y divide-fz-gray-200">
                <tr>
                    <td colspan="6" class="px-6 py-8 text-center text-fz-gray-500">Loading users...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", fetchUsers);

    async function fetchUsers() {
        try {
            const res = await fetch('/api/admin/users');
            if (res.ok) {
                const users = await res.json();
                const tbody = document.getElementById('users-tbody');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-fz-gray-500">No users found.</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(u => `
                    <tr class="hover:bg-fz-gray-50 transition-colors">
                        <td class="px-6 py-4 font-mono text-xs text-fz-gray-500">#${u.id}</td>
                        <td class="px-6 py-4 font-medium">${u.username}</td>
                        <td class="px-6 py-4 text-fz-gray-600">${u.email}</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${u.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'}">
                                ${u.role}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-fz-gray-500">${new Date(u.created_at).toLocaleDateString()}</td>
                        <td class="px-6 py-4 text-right">
                            <select onchange="updateRole(${u.id}, this.value)" class="text-xs border border-fz-gray-200 rounded px-2 py-1 mr-2 focus:ring-1 focus:ring-fz-black focus:border-fz-black outline-none">
                                <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                            <button onclick="deleteUser(${u.id})" class="text-fz-red hover:text-red-700 font-medium text-xs bg-red-50 hover:bg-red-100 px-3 py-1 rounded transition-colors">Delete</button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error('Error fetching users:', error);
            document.getElementById('users-tbody').innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-500">Error loading users.</td></tr>';
        }
    }

    async function updateRole(userId, newRole) {
        try {
            const res = await fetch(`/api/admin/users/${userId}/role`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: newRole })
            });
            if (res.ok) {
                fetchUsers();
            } else {
                const err = await res.json();
                alert(err.message || 'Failed to update role');
                fetchUsers();
            }
        } catch (e) {
            console.error(e);
            alert('Error updating role');
        }
    }

    async function deleteUser(userId) {
        if (!confirm('Are you sure you want to delete this user? This action cannot be undone and will cascade delete all their data.')) return;
        
        try {
            const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
            if (res.ok) {
                fetchUsers();
            } else {
                const err = await res.json();
                alert(err.message || 'Failed to delete user');
            }
        } catch (e) {
            console.error(e);
            alert('Error deleting user');
        }
    }
</script>
{% endblock %}
