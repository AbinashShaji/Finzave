{% extends "base_public.html" %}
{% block title %}Log in - FinZave{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center bg-fz-white py-12 px-6">
    <div class="w-full max-w-md bg-fz-gray-100 border border-fz-gray-200 rounded-3xl p-8 md:p-12 shadow-sm">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-fz-black mb-2">Welcome back</h1>
            <p class="text-sm text-fz-gray-800">Log in to your FinZave account</p>
        </div>

        <form id="login-form" class="flex flex-col gap-5">
            <!-- Username Input -->
            <div class="flex flex-col gap-2">
                <label for="username" class="text-sm font-medium text-fz-black">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-3 bg-white border border-fz-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-fz-black focus:border-transparent transition-all"
                    placeholder="Enter your username">
            </div>

            <!-- Password Input -->
            <div class="flex flex-col gap-2">
                <label for="password" class="text-sm font-medium text-fz-black">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 bg-white border border-fz-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-fz-black focus:border-transparent transition-all"
                    placeholder="Enter your password">
            </div>
            
            <!-- Error Message Container -->
            <div id="error-message" class="hidden text-sm text-fz-red font-medium mt-1"></div>

            <button type="submit" id="submit-btn"
                class="mt-2 w-full flex justify-center items-center py-3.5 bg-fz-black text-white font-medium rounded-xl hover:bg-fz-red transition-all duration-300 shadow-sm disabled:opacity-70 disabled:cursor-not-allowed">
                <span>Log in</span>
                <svg id="loading-spinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
        
        <div class="mt-8 text-center text-sm text-fz-gray-800">
            Don't have an account? 
            <a href="{{ url_for('public.signup') }}" class="font-medium text-fz-black hover:text-fz-red transition-colors">Sign up</a>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');
    const spinner = document.getElementById('loading-spinner');
    
    // Reset state
    errorDiv.classList.add('hidden');
    errorDiv.textContent = '';
    submitBtn.disabled = true;
    spinner.classList.remove('hidden');
    
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            if (data.user && data.user.role === 'admin') {
                window.location.href = '/admin';
            } else {
                window.location.href = '/app/'; 
            }
        } else {
            errorDiv.textContent = data.message || data.error || 'Login failed. Please check your credentials.';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.textContent = 'Network error. Please try again later.';
        errorDiv.classList.remove('hidden');
    } finally {
        submitBtn.disabled = false;
        spinner.classList.add('hidden');
    }
});
</script>
{% endblock %}
