{% extends "base_public.html" %}
{% block title %}404 Not Found - FinZave{% endblock %}

{% block content %}
<section class="relative pt-40 pb-40 min-h-[85vh] flex flex-col items-center justify-center bg-fz-white border-b border-fz-gray-200">
    <div class="max-w-[800px] mx-auto px-6 text-center z-10 observe-me fz-reveal-up">
        <h1 class="text-8xl md:text-9xl font-bold tracking-tighter text-fz-black mb-8">
            404
        </h1>
        <h2 class="text-3xl md:text-5xl font-semibold tracking-tighter text-fz-gray-800 mb-6">
            Looks like this page doesn't exist.
        </h2>
        <p class="text-lg text-fz-gray-600 mb-12 max-w-[45ch] mx-auto">
            The page may have moved, been removed, or the URL may be incorrect.
        </p>
        <a href="{{ url_for('public.home') }}" class="inline-flex justify-center items-center px-10 py-4 bg-fz-black text-white text-lg font-medium rounded-full hover:bg-fz-red transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-fz-black/10">
            Back to Home
        </a>
    </div>
    
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gradient-to-tr from-fz-gray-100 to-transparent rounded-full blur-[100px] -z-10 opacity-50"></div>
</section>
{% endblock %}
