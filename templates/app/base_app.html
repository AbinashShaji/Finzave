<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinZave{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Structural layout for fixed sidebar and independent scrolling */
        @media (min-width: 768px) {
            #main-content {
                margin-left: 16rem; /* width of w-64 */
            }
        }
    </style>
</head>
<body class="bg-fz-gray-50 text-fz-black font-sans selection:bg-fz-red selection:text-white relative">

    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between bg-white border-b border-fz-gray-200 px-6 py-4 sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-fz-black text-white flex items-center justify-center font-bold text-xl tracking-tighter">FZ</div>
            <span class="font-bold text-xl tracking-tight">FinZave</span>
        </div>
        <button id="mobile-menu-btn" class="p-2 relative z-50 text-fz-black">
            <i data-lucide="menu"></i>
        </button>
    </div>

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-fz-gray-200 text-fz-black transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-screen overflow-y-auto">
        <div class="p-6">
            <a href="{{ url_for('app.dashboard') }}" class="flex items-center gap-2 group mb-10">
                <div class="w-8 h-8 rounded-lg bg-fz-black text-white flex items-center justify-center font-bold text-xl tracking-tighter group-hover:bg-fz-red transition-colors duration-300">FZ</div>
                <span class="font-bold text-xl tracking-tight">FinZave</span>
            </a>
            
            <nav class="flex flex-col gap-2">
                <a href="{{ url_for('app.dashboard') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.dashboard' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="{{ url_for('app.transactions') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.transactions' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="receipt" class="w-5 h-5"></i> Transactions
                </a>
                <a href="{{ url_for('app.goals') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.goals' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="target" class="w-5 h-5"></i> Goals
                </a>
                <a href="{{ url_for('app.analysis') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.analysis' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i> Analysis
                </a>
                <a href="{{ url_for('app.planning') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.planning' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="calculator" class="w-5 h-5"></i> Planning
                </a>
                <a href="{{ url_for('app.reports') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.reports' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="file-text" class="w-5 h-5"></i> Reports
                </a>
                <a href="{{ url_for('app.feedback') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.feedback' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="message-square" class="w-5 h-5"></i> Feedback
                </a>
                <a href="{{ url_for('app.profile') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-fz-gray-50 {% if request.endpoint == 'app.profile' %}bg-fz-gray-50 text-fz-black font-semibold border-l-4 border-fz-red{% else %}text-fz-gray-600{% endif %}">
                    <i data-lucide="user" class="w-5 h-5"></i> Profile
                </a>
            </nav>
        </div>
        
        <div class="mt-auto p-6 border-t border-fz-gray-200">
            <button onclick="logout()" class="flex items-center gap-3 px-4 py-3 w-full rounded-lg text-sm font-medium text-fz-gray-600 hover:text-white hover:bg-fz-red transition-colors text-left group">
                <i data-lucide="log-out" class="w-5 h-5 group-hover:text-white transition-colors"></i> Log out
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content" class="flex flex-col min-h-screen max-w-full min-w-0">
        <header class="bg-white border-b border-fz-gray-200 h-[72px] hidden md:flex flex-shrink-0 items-center justify-between px-8 sticky top-0 z-20">
            <h1 class="text-xl font-bold tracking-tight">{% block header_title %}Dashboard{% endblock %}</h1>
            <div class="flex items-center gap-4">
                <a href="{{ url_for('app.profile') }}" title="Profile" class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-fz-black text-white text-sm font-semibold hover:bg-fz-red hover:shadow-md transition-all duration-300 ring-2 ring-transparent hover:ring-fz-red/30 focus:outline-none" id="header-avatar">
                    U
                </a>
            </div>
        </header>

        <div class="p-6 md:p-8 flex-1 w-full max-w-full overflow-x-hidden">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block modals %}{% endblock %}

    <script>
        function getCookie(name) {
            let value = "; " + document.cookie;
            let parts = value.split("; " + name + "=");
            if (parts.length === 2) return parts.pop().split(";").shift();
            return "";
        }

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            
            const btn = document.getElementById('mobile-menu-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            function toggleMenu() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            if (btn && sidebar && overlay) {
                btn.addEventListener('click', toggleMenu);
                overlay.addEventListener('click', toggleMenu);
            }

            // Fetch user dynamically for the header avatar
            const avatarEl = document.getElementById('header-avatar');
            if (avatarEl) {
                fetch('/api/auth/me')
                    .then(res => res.ok ? res.json() : null)
                    .then(user => {
                        if (user && user.username) {
                            avatarEl.textContent = user.username.charAt(0).toUpperCase();
                        }
                    })
                    .catch(err => console.error('Error fetching user avatar:', err));
            }
        });

        async function logout() {
            try {
                const csrfToken = getCookie('csrf_access_token');
                const res = await fetch('/api/auth/logout', { 
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': csrfToken
                    }
                });
                if (res.ok) {
                    window.location.href = '/login';
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
